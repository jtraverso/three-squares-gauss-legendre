# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The three squares theorem (Gauss–Legendre)"
  description: >-
    A Lean 4 / Mathlib proof of the three squares theorem of Legendre (1798) and Gauss (1801): a
    natural number is a sum of three squares if and only if it is not of the form 4^a (8 b + 7)
    (sum_three_sq_iff), with the corollary that every n ≡ 3 (mod 8) is x₀² + x₁² + x₂² for some
    x : Fin 3 → ℤ (exists_sum_sq_of_mod_eight_eq_three). The proof uses ternary quadratic forms of
    determinant one: a positive definite integral ternary form of determinant one is equivalent to
    x² + y² + z² (proved with Minkowski's convex body theorem), and for n ≢ 0 (mod 4), n ≢ 7
    (mod 8) such a form with diagonal entry n is built from a prime in an arithmetic progression
    (Dirichlet's theorem, as in Mathlib) and quadratic reciprocity for the Jacobi symbol. Two
    statements; no definitions beyond Mathlib's.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11E25", "11D85", "11H06"]

repository:
  role: "substantive-development"

sources:
  - title: "Disquisitiones Arithmeticae"
    authors:
      - "Carl Friedrich Gauss"
    type: "book"
    location: "Leipzig, 1801; articles 291–292 (numbers represented as sums of three squares)"
    relationship: "formalizes"
    note: >-
      The theorem that a number is a sum of three squares unless it is of the form 4^a (8 b + 7),
      first stated by Legendre (Essai sur la théorie des nombres, 1798). The proof formalized here
      is not Gauss's (theory of ternary forms and genera) but the later method with ternary forms
      of determinant one and Dirichlet's theorem on primes in arithmetic progressions.
    license: "public domain"
    author_endorsement: "n/a"
  - title: "Additive Number Theory: The Classical Bases"
    authors:
      - "Melvyn B. Nathanson"
    id: "doi:10.1007/978-1-4757-3845-2"
    type: "book"
    location: "Graduate Texts in Mathematics 164, Springer (1996), Chapter 1 (Sums of polygons)"
    relationship: "background"
    note: >-
      A textbook presentation of the method of ternary forms of determinant one with Dirichlet's
      theorem. Here the equivalence of unimodular positive definite ternary forms with x² + y² + z²
      is proved with Minkowski's convex body theorem rather than with reduction theory.
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    The three squares theorem for natural numbers and its corollary for n ≡ 3 (mod 8) with integer
    coordinates. Not formalized: the number of representations (Gauss's class number formula).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the Lean development (directory ThreeSquaresLib/), the Challenge/Solution pair and
        the packaging under the author's direction, checked with lake build, #print axioms and a
        comparison of the elaborated Challenge and Solution statements (pp.all) (Lean
        v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    The theorem is stated for natural numbers n with natural x, y, z (the integer version follows
    by absolute values); the corollary is stated with x : Fin 3 → ℤ and ∑ i, x i ^ 2.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent checked
    the statements against the classical theorem, including the cases n = 0 (0 = 0² + 0² + 0²),
    n = 7, 28 (excluded) and n ≡ 3 (mod 8) with square factors. The author directed the work and
    chose the result. No independent human review of the formalization has been performed. The
    result is classical; no mathematical novelty is claimed.

alignment:
  namespace: "GaussLegendre"
  statements:
    - {source: "Legendre (1798), Gauss (1801, art. 291–292): the three squares theorem", lean: "GaussLegendre.sum_three_sq_iff", module: "ThreeSquaresChallenge", status: "proved"}
    - {source: "Corollary: every n ≡ 3 (mod 8) is a sum of three squares", lean: "GaussLegendre.exists_sum_sq_of_mod_eight_eq_three", module: "ThreeSquaresChallenge", status: "proved"}

acknowledgements: >-
  Mathlib and the Lean community.
