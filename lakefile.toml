name = "three_squares"
version = "0.1.0"
defaultTargets = ["ThreeSquaresLib", "ThreeSquaresChallenge", "ThreeSquaresSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "ThreeSquaresLib"
globs = ["ThreeSquaresLib.+"]

[[lean_lib]]
name = "ThreeSquaresChallenge"
roots = ["ThreeSquaresChallenge"]

[[lean_lib]]
name = "ThreeSquaresSolution"
roots = ["ThreeSquaresSolution"]
